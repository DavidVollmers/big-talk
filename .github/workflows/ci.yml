name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Sync Python dependencies
        run: npm run sync

      - name: Lint, test, and build big-talk
        run: npx nx run-many -t lint test build -p big-talk
